[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microchips-seo-growth-agent"
version = "0.1.0"
description = "Safety-first SEO/CRO/GEO growth operating system for microchips.by"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/seo_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["seo_agent"]
